<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿尔泰共和国</title>
    <meta name="description" content="俄罗斯城市旅行指南">
    <link rel="stylesheet" href="../../css/style_city.css">
</head>
<body>
    <!-- Фиксированная панель управления -->
    <header class="headerPanel">
        <div class="language-switcher">
            <a href="index_ru.html" class="lang-link" aria-label="Русский" data-lang="ru">РУ</a>
            <span class="lang-separator">|</span>
            <a href="index_en.html" class="lang-link" aria-label="English" data-lang="en">EN</a>
            <span class="lang-separator">|</span>
            <a href="index_zh.html" class="lang-link active" aria-label="中文" data-lang="zh">中文</a>
        </div>
        <!-- Кнопка выхода -->
        <a href="../../index_zh.html" class="exitButton" aria-label="Вернуться на главную">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
            </svg>
        </a>
    </header>

 <!-- Главный баннер -->
    <section class="mainBanner">
        <div class="mainBanner__background" style="background-image: url('../../img/altai/banner/altai_main.jpg')"></div>
    </section>

    <!-- Вводная секция с описанием региона  -->
    <section class="regionIntro">
        <div class="regionIntro__container">
            <h1 class="regionIntro__title">阿尔泰共和国</h1>
            <p class="regionIntro__subtitle"></p>
            <p class="regionIntro__text">
                阿尔泰共和国位于欧亚大陆的正中心，与三个国家接壤：哈萨克斯坦、蒙古和中国。阿尔泰的心脏是山脉，
                从西西伯利亚平原一直延伸至戈壁沙漠，绵延近2000公里。该山系中的三个保护区被共同纳入&quot;阿尔泰金山&quot;自然综合体。
                此地可见2000多种植物，其中约200种为特有物种。
            </p>
        </div>
    </section>

    <!-- Секция: Точки притяжения региона -->
    <section class="contentSection contentSection--gray">
        <div class="container">
            <h2 class="contentSection__title">区域亮点</h2>
            <div class="carousel">
                <div class="carousel__wrapper">
                    <div class="carousel__track" data-category="attractions">
                        <!-- Карточки генерируются через JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Секция: Выбраться на природу -->
    <section class="contentSection contentSection--white">
        <div class="container">
            <h2 class="contentSection__title">奔赴自然野趣</h2>

            <div class="carousel">

                <div class="carousel__wrapper">
                    <div class="carousel__track" data-category="nature">
                        <!-- Карточки генерируются через JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Секция: Культурный код -->
    <section class="contentSection contentSection--gray">
        <div class="container">
            <h2 class="contentSection__title">解读文化密码</h2>
            <div class="carousel">
                <div class="carousel__wrapper">
                    <div class="carousel__track" data-category="culture">
                        <!-- Карточки генерируются через JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </section>



    <!-- Модальное окно -->
    <div class="modal" id="attractionModal">
        <div class="modal__overlay"></div>
        <div class="modal__container">
            <button class="modal__close" aria-label="Закрыть">
                <svg viewBox="0 0 24 24">
                    <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
                </svg>
            </button>

            <div class="modal__content" id="modalContent">
                <!-- Контент загружается динамически -->
                <div class="modal__loader">
                    <div class="loader"></div>
                    <p>Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/data_zh.js"></script>
    <script src="../../js/main_city.js"></script>


</body>
</html>
