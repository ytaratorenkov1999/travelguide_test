 <!-- Главный баннер -->

    <!-- Вводная секция с описанием региона  -->
    <section class="regionIntro">
        <div class="regionIntro__container">
            <h1 class="regionIntro__title">加里宁格勒州</h1>
            <p class="regionIntro__subtitle"></p>
            <p class="regionIntro__text">
                加里宁格勒州是俄罗斯最西部、最独特的地区，被欧洲环抱，依偎着波罗的海。这是一片琥珀、哥特式建筑与海风交织的土地。
                这里融合了柯尼斯堡的德国遗产、普鲁士城堡、骑士传说，以及泽列诺格拉茨克和斯韦特洛戈尔斯克的现代度假胜地。
                库尔斯沙嘴是一处独特的自然奇观：一条狭长的陆地分隔大海与海湾，沙丘在风中舞动，森林中藏匿着奇特的“醉林”。
                加里宁格勒州，一个能在波罗的海畔观赏日落、品尝琥珀蜂蜜、漫步古城石板路的地方，在这里，欧式建筑与俄罗斯灵魂交融，
                营造出边境世界独有的氛围。
            </p>
        </div>
    </section>

    <!-- Секция: Выбраться на природу -->
