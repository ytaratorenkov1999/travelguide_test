        <div class="language-switcher">
            <a href="index_ru.html" class="lang-link" aria-label="Русский" data-lang="ru">РУ</a>

 <!-- Главный баннер -->

    <!-- Вводная секция с описанием региона  -->
    <section class="regionIntro">
        <div class="regionIntro__container">
            <h1 class="regionIntro__title">萨马拉州</h1>
            <p class="regionIntro__subtitle"></p>
            <p class="regionIntro__text">
                伏尔加河曲，日古利山，草原上缤纷的野花，以及白色舰船般诱人的剪影。萨马拉州，或许将俄罗斯平原的万千美景集于一身，
                并将其化为一座巨大的游乐公园。1586年，沙皇费奥多尔&middot;伊万诺维奇（伊凡雷帝的第三子）下令在伏尔加河与萨马拉河交汇处建立一座要塞。未来俄罗斯的航天之都，
                由此诞生。今天，在将近450年之后，萨马拉州已成为俄罗斯最发达的地区之一，其面积可与某些国家相当。关键交通干线贯穿该地区：西伯利亚大铁路与南北国际运输走廊。
            </p>
        </div>
    </section>

    <!-- Секция: Точки притяжения региона -->

        <div class="container">
            <h2 class="contentSection__title">区域亮点</h2>

    <!-- Секция: Выбраться на природу -->
    <section class="contentSection contentSection--white">

            <div class="carousel">

                    <div class="carousel__track" data-category="nature">

    <!-- Секция: Культурный код -->

    <!-- Модальное окно -->

            <button class="modal__close" aria-label="Exit">

    </div>
