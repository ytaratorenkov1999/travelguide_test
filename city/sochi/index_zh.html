<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>索契</title>
    <meta name="description" content="指南合集">
    <link rel="stylesheet" href="../../css/style_city.css">
</head>
<body>
    <!-- Фиксированная панель управления -->
    <header class="headerPanel">

        <div class="language-switcher">
            <a href="index_ru.html" class="lang-link" aria-label="Русский" data-lang="ru">РУ</a>
            <span class="lang-separator">|</span>
            <a href="index_en.html" class="lang-link" aria-label="English" data-lang="en">EN</a>
            <span class="lang-separator">|</span>
            <a href="index_zh.html" class="lang-link active" aria-label="中文" data-lang="zh">中文</a>
        </div>


        <!-- Кнопка выхода -->
        <a href="../../index_zh.html" class="exitButton" aria-label="Back to main">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
            </svg>
        </a>
    </header>

    <!-- Главный баннер -->
    <section class="mainBanner">
        <div class="mainBanner__background" style="background-image: url('../../img/sochi/banner/sochi_main.jpg')"></div>
    </section>

    <!-- Вводная секция с описанием региона  -->
    <section class="regionIntro">
        <div class="regionIntro__container">
            <h1 class="regionIntro__title">索契</h1>
            <p class="regionIntro__subtitle"></p>

            <p class="regionIntro__text">
                从棕榈与木兰到皑皑白雪，从海上微风到山峦之巅。索契&mdash;&mdash;一个独特的世界，在这里，
                亚热带风光与高加索山脉相遇，共同缔造了俄罗斯的自然奇观。1838年，亚历山大要塞在此奠基，为这颗黑海沿岸的明珠日后绽放奠定了基石。今天，
                历经近两个世纪，索契已成为国家首席度假胜地，是2014年奥运会及世界级盛会的举办地，
                其狭长的城市跨度使其成为全球第二长的城市。海上航线和通往阿布哈兹及高加索腹地的关键公路在此交汇。
            </p>
        </div>
    </section>


    <!-- Город -->
    <section class="contentSection contentSection--gray">
        <div class="container">
<!--            <h2 class="contentSection__title">Москва</h2>-->
            <div class="carousel">
                <div class="carousel__wrapper">
                    <div class="carousel__track" data-category="city">
                        <!-- Карточки генерируются через JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Модальное окно -->
    <div class="modal" id="attractionModal">
        <div class="modal__overlay"></div>
        <div class="modal__container">
            <button class="modal__close" aria-label="Exit">
                <svg viewBox="0 0 24 24">
                    <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
                </svg>
            </button>

            <div class="modal__content" id="modalContent">
                <!-- Контент загружается динамически -->
                <div class="modal__loader">
                    <div class="loader"></div>
                    <p>Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/data_zh.js"></script>
    <script src="../../js/main_city.js"></script>


</body>
</html>
